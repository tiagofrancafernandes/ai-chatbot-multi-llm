services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: chatbot_backend
        restart: unless-stopped
        ports:
            - '${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}'
        environment:
            - PORT=${BACKEND_PORT:-3001}
            - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
            - DEFAULT_MODEL=${DEFAULT_MODEL:-tev1:0.8b}
            - ENABLED_PROVIDERS=${ENABLED_PROVIDERS:-ollama,gemini}
            - OLLAMA_HOST=http://host.docker.internal:11434
            - OLLAMA_DECISION_MODEL=${OLLAMA_DECISION_MODEL:-tev1:0.8b}
            - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-qwen2.5:0.5b}
            - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:1b}
            - GEMINI_API_KEY=${GEMINI_API_KEY:-}
            - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
            - LMSTUDIO_HOST=${LMSTUDIO_HOST:-http://host.docker.internal:1234/v1}
            - DATABASE_FILE_PATH=/app/data/db.json
        volumes:
            - ./backend/data:/app/data
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
        container_name: chatbot_frontend
        restart: unless-stopped
        ports:
            - '${FRONTEND_PORT:-5174}:5173'
        depends_on:
            - backend

    ollama_bridge:
        image: alpine/socat
        container_name: chatbot_ollama_bridge
        restart: unless-stopped
        network_mode: host
        command: 'TCP-LISTEN:11434,bind=172.17.0.1,reuseaddr,fork TCP:127.0.0.1:11434'
